<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>처리 오류</title>
    <style>
        body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; background:#0b1020; color:#e8edf8; font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
        .card { width:min(560px, calc(100% - 32px)); padding:28px; border-radius:24px; background:#121a31; border:1px solid rgba(255,255,255,.08); }
        h1 { margin:0 0 12px; }
        p { color:#aab7d1; line-height:1.7; }
        a { display:inline-flex; margin-top:18px; padding:10px 14px; border-radius:12px; color:inherit; text-decoration:none; border:1px solid rgba(255,255,255,.1); }
    </style>
</head>
<body>
    <div class="card">
        <h1>요청을 처리하지 못했습니다</h1>
        <p>{{ message|default:"제품명·주성분명 또는 증상을 다시 입력해 주세요." }}</p>
        <a href="/">메인으로 돌아가기</a>
    </div>
</body>
</html>
