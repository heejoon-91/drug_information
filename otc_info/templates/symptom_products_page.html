<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>제품/성분 직접 입력</title>
    <style>
        body { margin:0; background:#0b1020; color:#e8edf8; font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
        .wrap { max-width:860px; margin:0 auto; padding:30px 20px 48px; }
        .card { background:#121a31; border:1px solid rgba(255,255,255,.08); border-radius:24px; padding:24px; margin-bottom:18px; }
        .link, .chip, .btn { border:1px solid rgba(255,255,255,.1); background:rgba(255,255,255,.04); color:inherit; text-decoration:none; padding:10px 14px; border-radius:12px; }
        .btn.primary { background:linear-gradient(135deg,#38bdf8,#8b5cf6); border:none; cursor:pointer; }
        .row { display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
        input[type=text] { flex:1; min-width:240px; padding:15px 16px; border-radius:14px; border:1px solid rgba(255,255,255,.1); background:#0f1730; color:#fff; }
        .chips { display:flex; flex-wrap:wrap; gap:8px; margin-top:12px; }
        p, li { color:#aab7d1; line-height:1.7; }
        textarea { width:100%; min-height:150px; border-radius:16px; border:1px solid rgba(255,255,255,.1); background:#0f1730; color:#fff; padding:14px; font:inherit; }
    </style>
</head>
<body>
    <div class="wrap">
        <div class="row" style="margin-bottom:18px; justify-content:space-between;">
            <a class="link" href="/">← 메인으로</a>
            <a class="link" href="/smart-search/?q={{ symptom|urlencode }}">증상 결과로 돌아가기</a>
        </div>

        <section class="card">
            <h1>직접 고른 제품/성분 점검</h1>
            <p>현재 증상 메모: <strong>{{ symptom }}</strong></p>
            <p>이 페이지는 증상 기반 추천이 아니라, 사용자가 직접 입력한 제품명·주성분명을 기준으로만 점검합니다.</p>
            <form action="/smart-search/" method="get">
                <input type="hidden" name="symptom_context" value="{{ symptom }}">
                <div class="row">
                    <input type="text" name="q" id="manualCheckInput" placeholder="예: Tylenol, acetaminophen, Advil, ibuprofen" required>
                    <button class="btn primary" type="submit">점검 실행</button>
                </div>
            </form>
            <div class="chips">
                {% if followup.generic_examples %}
                    {% for item in followup.generic_examples %}
                    <button class="chip" type="button" data-value="{{ item }}">{{ item }}</button>
                    {% endfor %}
                {% endif %}
            </div>
        </section>

        {% if consultation_note %}
        <section class="card">
            <h2>약사 상담용 메모</h2>
            <textarea readonly>{{ consultation_note.memo_text }}</textarea>
        </section>
        {% endif %}
    </div>

    <script>
        document.querySelectorAll('.chip').forEach((button) => {
            button.addEventListener('click', () => {
                const target = document.getElementById('manualCheckInput');
                if (target) {
                    target.value = button.dataset.value || '';
                    target.focus();
                }
            });
        });
    </script>
</body>
</html>
